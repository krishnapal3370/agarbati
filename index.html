<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Solar Dryer Dashboard</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f1f7f4;
  color: #17352a;
}

/* ================= HEADER ================= */

.header {
  background: linear-gradient(135deg, #087f5b, #20a36a);
  color: white;
  text-align: center;
  padding: 28px 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.15);
}

.header h1 {
  margin: 0;
  font-size: 30px;
  letter-spacing: 1px;
}

.header p {
  margin: 8px 0 0;
  font-size: 14px;
  opacity: 0.95;
}

/* ================= CONTAINER ================= */

.container {
  max-width: 900px;
  margin: auto;
  padding: 30px 20px;
}

/* ================= GRID ================= */

.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

/* ================= CARD ================= */

.card {
  background: white;
  border-radius: 20px;
  padding: 32px 18px;
  text-align: center;
  box-shadow: 0 5px 18px rgba(0,0,0,0.10);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-4px);
}

.icon {
  font-size: 35px;
  margin-bottom: 10px;
}

.title {
  font-size: 14px;
  font-weight: bold;
  color: #66756f;
  letter-spacing: 0.6px;
  margin-bottom: 15px;
}

.value {
  font-size: 46px;
  font-weight: bold;
  color: #087f5b;
}

.unit {
  font-size: 20px;
  color: #52605a;
}

/* ================= BATTERY ================= */

.batteryOuter {
  width: 85%;
  height: 24px;
  margin: 20px auto 5px;
  background: #e3e8e6;
  border-radius: 14px;
  overflow: hidden;
}

.batteryFill {
  height: 100%;
  width: 89%;
  background: linear-gradient(
    90deg,
    #ff922b,
    #20a36a
  );
  transition: width 1s ease;
}

.batteryText {
  margin-top: 12px;
  font-size: 13px;
  color: #66756f;
}

/* ================= STATUS ================= */

.status {
  margin-top: 28px;
  padding: 15px;
  background: white;
  border-radius: 14px;
  text-align: center;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
  color: #087f5b;
  font-weight: bold;
  font-size: 14px;
}

.onlineDot {
  display: inline-block;
  width: 10px;
  height: 10px;
  background: #20a36a;
  border-radius: 50%;
  margin-right: 7px;
}

/* ================= FOOTER ================= */

.footer {
  text-align: center;
  margin-top: 25px;
  font-size: 12px;
  color: #7b8983;
}

/* ================= MOBILE ================= */

@media(max-width: 750px) {

  .cards {
    grid-template-columns: 1fr;
  }

  .header h1 {
    font-size: 24px;
  }

}

</style>
</head>

<body>


<!-- ================= HEADER ================= -->

<div class="header">

  <h1>SUNCONFLUENCE SMART SOLAR DRYER</h1>

  <p>
    Live Temperature • Humidity • Battery Monitoring
  </p>

</div>


<!-- ================= MAIN ================= -->

<div class="container">


  <div class="cards">


    <!-- ================= TEMPERATURE ================= -->

    <div class="card">

      <div class="icon">
        🌡️
      </div>

      <div class="title">
        TEMPERATURE
      </div>

      <span
        class="value"
        id="temperature">
        29.2
      </span>

      <span class="unit">
        °C
      </span>

    </div>


    <!-- ================= HUMIDITY ================= -->

    <div class="card">

      <div class="icon">
        💧
      </div>

      <div class="title">
        HUMIDITY
      </div>

      <span
        class="value"
        id="humidity">
        74
      </span>

      <span class="unit">
        %
      </span>

    </div>


    <!-- ================= BATTERY ================= -->

    <div class="card">

      <div class="icon">
        🔋
      </div>

      <div class="title">
        BATTERY LEVEL
      </div>

      <span
        class="value"
        id="battery">
        89
      </span>

      <span class="unit">
        %
      </span>


      <div class="batteryOuter">

        <div
          class="batteryFill"
          id="batteryFill"
          style="width:89%">
        </div>

      </div>


      <div
        class="batteryText"
        id="batteryStatus">
        Battery Status: GOOD
      </div>

    </div>


  </div>


  <!-- ================= STATUS ================= -->

  <div class="status">

    <span class="onlineDot"></span>

    Smart Solar Dryer Dashboard Online

  </div>


  <!-- ================= FOOTER ================= -->

  <div class="footer">

    Team SunConfluence • Smart Solar-Powered Dryer Monitoring System

  </div>


</div>



<!-- ========================================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================================= -->

<script>


/* ============================================================
   LIMIT VALUES
   ============================================================ */

function clamp(value, min, max) {

  return Math.max(
    min,
    Math.min(max, value)
  );

}


/* ============================================================
   STARTING BATTERY
   ============================================================ */

const startingBattery = 89;


/* ============================================================
   BATTERY DROP INTERVAL

   1% every 15 minutes
   ============================================================ */

const batteryDropInterval =
  15 * 60 * 1000;


/* ============================================================
   DASHBOARD START TIME
   ============================================================ */

const dashboardStartTime =
  Date.now();



/* ============================================================
   UPDATE DASHBOARD
   ============================================================ */

function updateDashboard() {


  const t =
    Date.now() / 1000;



  /* =========================================================
     TEMPERATURE

     Approximately 28°C to 30°C
     ========================================================= */

  let temperature =
    29.0 +
    Math.sin(t / 9) * 0.8;


  temperature =
    clamp(
      temperature,
      28.0,
      30.0
    );



  /* =========================================================
     HUMIDITY

     Approximately 73% to 75%
     ========================================================= */

  let humidity =
    74 +
    Math.sin(t / 11) * 0.9;


  humidity =
    clamp(
      humidity,
      73,
      75
    );



  /* =========================================================
     BATTERY

     Starts at 89%

     Drops only 1% every 15 minutes
     ========================================================= */

  const elapsedTime =
    Date.now() -
    dashboardStartTime;


  const batteryDrop =
    Math.floor(
      elapsedTime /
      batteryDropInterval
    );


  let battery =
    startingBattery -
    batteryDrop;


  battery =
    clamp(
      battery,
      0,
      100
    );



  /* =========================================================
     BATTERY STATUS TEXT
     ========================================================= */

  let batteryStatus;


  if (battery >= 80) {

    batteryStatus =
      "Battery Status: GOOD";

  }

  else if (battery >= 50) {

    batteryStatus =
      "Battery Status: NORMAL";

  }

  else if (battery >= 20) {

    batteryStatus =
      "Battery Status: LOW";

  }

  else {

    batteryStatus =
      "Battery Status: CRITICAL";

  }



  /* =========================================================
     UPDATE TEMPERATURE
     ========================================================= */

  document
    .getElementById("temperature")
    .textContent =
      temperature.toFixed(1);



  /* =========================================================
     UPDATE HUMIDITY
     ========================================================= */

  document
    .getElementById("humidity")
    .textContent =
      humidity.toFixed(0);



  /* =========================================================
     UPDATE BATTERY
     ========================================================= */

  document
    .getElementById("battery")
    .textContent =
      battery;



  document
    .getElementById("batteryFill")
    .style.width =
      battery + "%";



  document
    .getElementById("batteryStatus")
    .textContent =
      batteryStatus;

}


/* ============================================================
   UPDATE VALUES EVERY 2 SECONDS
   ============================================================ */

setInterval(
  updateDashboard,
  2000
);


/* ============================================================
   INITIAL UPDATE
   ============================================================ */

updateDashboard();


</script>


</body>
</html>
